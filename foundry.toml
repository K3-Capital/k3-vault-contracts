[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200

[etherscan]
# Explicit Arc V2 mapping for Foundry versions without built-in Arc metadata.
# Requires a V2-capable client; verify.sh enforces Foundry >= 1.5.0.
arc = { key = "${ETHERSCAN_API_KEY}", chain = 5042, url = "https://api.etherscan.io/v2/api?chainid=5042" }


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

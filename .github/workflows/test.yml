name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

env:
  ARBITRUM_ONE_RPC_URL:  ${{ secrets.ARBITRUM_ONE_RPC_URL }}
  BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Show Forge version
        run: |
          forge --version

      - name: Install Rust for offline salt miner
        uses: dtolnay/rust-toolchain@stable

      - name: Test offline salt miner
        run: |
          forge build
          cargo build --release --locked --manifest-path tools/salt-miner/Cargo.toml
          python3 -m unittest tools.test_mine_salt tools.test_mining_backend tools.test_salt_boundaries -v

      - name: Test verification wrapper (offline public fixtures)
        run: python3 -m unittest tools.test_verify -v

      - name: Validate deployment manifests
        run: |
          python3 -m unittest deployments/test_validate.py
          python3 deployments/validate.py

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build and contract size check
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
